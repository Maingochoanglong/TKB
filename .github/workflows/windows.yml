# Kiểm chứng trên máy ảo Windows thật của GitHub: chạy toàn bộ test và main.py mặc định với dữ liệu mẫu,
# in "Mã kết quả" để so giữa các máy Windows (OR-Tools bản Windows ra TKB khác bản Linux).
# Chỉ dùng dữ liệu mẫu trong repo (tên giả); không đưa file có tên giáo viên thật lên đây.
name: Kiểm chứng trên Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Cài thư viện
        run: python -m pip install -r requirements.txt
      - name: Chạy test
        run: python -m pytest -q -rs
      - name: Chạy main.py mặc định với dữ liệu mẫu
        run: python main.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ket-qua-windows-python${{ matrix.python }}
          path: out/
