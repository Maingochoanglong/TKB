# Kiểm chứng trên máy ảo Windows thật của GitHub: mọi máy Windows (Windows Server 2022 và 2025, Python 3.12 và
# 3.14, loại CPU tuỳ máy ảo) chạy main.py với các hằng số mặc định (file FILE_VAO) phải ra cùng "Mã kết quả", và
# mỗi máy chạy 2 lần cũng phải ra cùng mã. OR-Tools bản Windows ra TKB khác bản Linux, nên chỉ so giữa các máy
# Windows với nhau. FILE_VAO có tên giáo viên thật: chỉ tải lên mã kết quả, không tải các file ra.
name: Kiểm chứng trên Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SO_MAY: 4  # số máy trong ma trận bên dưới

jobs:
  windows:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        python: ["3.12", "3.14"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Thông tin máy
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $os = Get-CimInstance Win32_OperatingSystem
          $py = python -c "import platform; print(platform.python_version())"
          "$($os.Caption) $($os.Version) | Python $py | $($cpu.Name.Trim()) | $($cpu.NumberOfCores) nhân, $($cpu.NumberOfLogicalProcessors) luồng" | Tee-Object -FilePath may.txt
      - name: Cài thư viện
        run: python -m pip install -r requirements.txt
      - name: Chạy test
        run: python -m pytest -q -rs
      - name: Chạy main.py 2 lần với các hằng số mặc định
        if: success() || failure()  # vẫn chạy để lấy mã kết quả khi có test trượt
        run: python .github/scripts/chay_mau.py "${{ matrix.os }}"
      - uses: actions/upload-artifact@v4  # chỉ mã kết quả, không có tên giáo viên
        if: always()
        with:
          name: ket-qua-${{ matrix.os }}-python${{ matrix.python }}
          path: ma_ket_qua.txt

  so-sanh:
    name: So sánh mã kết quả giữa các máy Windows
    needs: windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ket-qua-*
      - name: So sánh
        run: |
          shopt -s nullglob
          files=(ket-qua-*/ma_ket_qua.txt)
          {
            echo "| Máy | Thông tin | Mã kết quả |"
            echo "|---|---|---|"
            for f in "${files[@]}"; do sed 's/^/| /; s/$/ |/' "$f"; done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${#files[@]}" -ne "$SO_MAY" ]; then
            echo "::error::Chỉ ${#files[@]}/$SO_MAY máy báo được mã kết quả"
            exit 1
          fi
          codes=$(for f in "${files[@]}"; do awk -F' [|] ' '{print $NF}' "$f"; done | sort -u)
          if [ "$(echo "$codes" | wc -l)" -ne 1 ]; then
            echo "::error::Các máy Windows ra mã khác nhau: $(echo $codes)"
            exit 1
          fi
          echo "Mọi máy Windows ra cùng mã: $codes" | tee -a "$GITHUB_STEP_SUMMARY"
